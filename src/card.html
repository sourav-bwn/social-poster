<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=1080, initial-scale=1"><title>Project card</title><style>
*{box-sizing:border-box}html,body{margin:0;width:1080px;height:1080px;overflow:hidden}body{background:#111b2b;color:#f4f6f5;font-family:Arial,Helvetica,sans-serif}.card{width:1080px;height:1080px;padding:78px 84px;position:relative;background:radial-gradient(circle at 95% 5%,#225e6a 0%,transparent 41%),linear-gradient(140deg,#101927,#152b39 76%,#122f33)}.eyebrow{display:flex;gap:18px;align-items:center;color:#76d9c3;text-transform:uppercase;letter-spacing:4px;font-size:19px;font-weight:700}.mark{width:20px;height:20px;border:3px solid #76d9c3;transform:rotate(45deg);display:inline-block}.accent{position:absolute;right:80px;top:170px;width:230px;height:230px;border:1px solid #4f8e91;border-radius:34px;transform:rotate(-12deg);opacity:.8}.accent:after{content:'';position:absolute;inset:40px;border:1px solid #4f8e91;border-radius:22px}h1{position:relative;font-size:84px;line-height:1.04;letter-spacing:-4px;max-width:840px;margin:148px 0 30px;font-weight:750}p{font-size:28px;line-height:1.35;color:#c2d3d2;max-width:750px}.rule{height:1px;background:#47626b;margin:66px 0 38px}.features{display:flex;flex-wrap:wrap;gap:14px}.feature{font-size:22px;border:1px solid #638185;color:#d3e5e3;border-radius:40px;padding:14px 22px}.footer{position:absolute;bottom:70px;left:84px;right:84px;display:flex;justify-content:space-between;color:#9dbbb8;font-size:20px;letter-spacing:1px}.small{color:#76d9c3}
</style><div class="card"><div class="eyebrow"><span class="mark"></span><span id="eyebrow"></span></div><div class="accent"></div><h1 id="headline"></h1><p id="summary"></p><div class="rule"></div><div class="features" id="features"></div><div class="footer"><span id="name"></span><span class="small">BUILT BY SOURAV GARAI</span></div></div><script>
const x=JSON.parse(new URLSearchParams(location.search).get('data'));for(const k of ['eyebrow','headline','summary','name'])document.getElementById(k).textContent=x[k];for(const t of x.features){const el=document.createElement('span');el.className='feature';el.textContent=t;document.getElementById('features').append(el)}
</script></html>
