name: Social poster - draft generation only
on:
  schedule:
    # Monday-Friday at 10:00 IST (04:30 UTC; GitHub scheduling may drift).
    - cron: '30 4 * * 1-5'
  workflow_dispatch:
    inputs:
      operation:
        description: Generate a new draft for review
        required: true
        type: choice
        options: [generate]
permissions:
  contents: write
  issues: write
concurrency:
  group: social-poster
  cancel-in-progress: false
jobs:
  generate:
    if: github.event_name == 'schedule' || inputs.operation == 'generate'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Generate draft (no publishing)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -o pipefail
          node src/cli.mjs generate | tee /tmp/generated.json
      - name: Commit pending draft
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pending/
          git commit -m 'Add pending project post for review'
          git push
      - name: Create review issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(node -p 'JSON.parse(require("fs").readFileSync("/tmp/generated.json","utf8")).id')
          printf 'Draft awaiting Sourav review. Nothing has been posted.\n\nText and any available real app screenshots: https://github.com/%s/tree/main/pending/%s\n\nReview and edit the caption, verify every claim and image, and ask Sourav to approve the final package. Publication happens separately through his signed-in LinkedIn profile; this workflow never publishes.\n' "$GITHUB_REPOSITORY" "$id" > /tmp/review-issue.md
          gh issue create --title "Review social post: $id" --body-file /tmp/review-issue.md
